# Example Portainer stack (docker-compose format) for multi-omp.
#
# Portainer: Stack -> Add stack -> paste the part below the `---` line,
# or upload this file. Then open http://<host>:30140/ .
#
# Code + dependencies are bind-mounted from the host into /app, so source
# edits never require rebuilding the image. The host path below
# (/opt/multi_omp/app) is the default clone location on this fleet —
# adjust it to wherever app/ lives on your machine. One-time prerequisite:
# `bun install` inside app/ so the mount carries a populated node_modules.
#
# Environment variables (all optional, defaults shown):
#   MULTI_OMP_PORT      30140   gateway/dashboard port
#   MULTI_OMP_HOST      0.0.0.0 bind address (0.0.0.0 inside a container)
#                           — always an IP, never a hostname/FQDN
---
services:
  multi-omp:
    image: multi-omp:latest
    container_name: multi-omp
    restart: unless-stopped
    ports:
      - "30140:30140"
      - "30200-30299:30200-30299"
    environment:
      MULTI_OMP_PORT: "30140"
      # Bind 0.0.0.0 so the dashboard is reachable from outside the container.
      # MULTI_OMP_HOST takes precedence over HOSTNAME_BIND: never let a machine
      # FQDN reach the bind target (resolves to an IP the port-forward owns).
      MULTI_OMP_HOST: "0.0.0.0"
      MULTI_OMP_HOME: /data
    volumes:
      # Code + node_modules from the host; /app inside the image is fully
      # shadowed by this mount (that is the point: edit, no rebuild).
      - /opt/multi_omp/app:/app
      - multi-omp-data:/data
      # Host FQDN readable inside the container as /etc/hostname (read-only).
      - /etc/hostname:/etc/hostname:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:30140/api/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  multi-omp-data:

# Building the image (done once, before deploying the stack):
#   docker build -t multi-omp:latest .
