# Example docker compose stack for multi-omp.
#
#   bun install --cwd app     # one-time: deps inside app/ (gitignored)
#   docker compose -f docker-compose.example.yaml up -d
#
# The dashboard lands on http://<host>:30140/ and each node on its own
# port from 30200-30299 (see the "Local" column in the dashboard).
#
# Code + dependencies are bind-mounted from the host's app/ directory into
# /app, so source edits never require rebuilding the image. The image is a
# runtime only (Bun + non-root user + /data).
#
# Note: node URLs in MULTI_OMP_HOME/nodes.json must be reachable FROM
# inside the container. "host.docker.internal" works on Docker Desktop
# (Mac/Windows) and on Linux with `extra_hosts` as shown below; for nodes
# on the LAN, use their real IP.
services:
  multi-omp:
    build: .
    container_name: multi-omp
    restart: unless-stopped
    ports:
      # dashboard / control plane
      - "30140:30140"
      # per-node proxy listeners
      - "30200-30299:30200-30299"
    environment:
      MULTI_OMP_PORT: "30140"
      # Bind 0.0.0.0 so the dashboard is reachable from outside the container.
      # MULTI_OMP_HOST takes precedence over HOSTNAME_BIND: never let a machine
      # FQDN (e.g. "host.domain") reach the bind target — it resolves to an IP
      # the port-forward already owns and the bind fails with EADDRINUSE.
      MULTI_OMP_HOST: "0.0.0.0"
      # Where nodes.json (credentials + registry) is stored on the host.
      MULTI_OMP_HOME: /data
    volumes:
      # Code + node_modules from the host; /app inside the image is fully
      # shadowed by this mount (that is the point: edit, no rebuild).
      - ./app:/app
      # Where nodes.json (credentials + registry) is stored.
      - ./data:/data
      # Host FQDN readable inside the container as /etc/hostname (read-only).
      - /etc/hostname:/etc/hostname:ro
    # Needed so "http://host.docker.internal:30141" resolves to the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Health check: the control plane answers on 30140.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:30140/api/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
